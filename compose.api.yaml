# Local demonstration only; the historical delivery approval remains unchanged.
services:
  api:
    image: car-accident-api:local
    build:
      context: .
      dockerfile_inline: |
        FROM car-accident-runtime:local
        COPY src/api/requirements.txt /opt/api-requirements.txt
        RUN python -m pip install --no-cache-dir -r /opt/api-requirements.txt && python -m pip check
        COPY src/api/ /app/src/api/
    working_dir: /app
    command: ["python", "-m", "uvicorn", "src.api.service:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    environment:
      MODEL_PATH: /app/model/trained_model.joblib
      MODEL_SHA256: 9dcd169ed58e0b09a2367b17055abee4b7424741d1b02fa60aa196fe049f6b99
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./data/runs/reference_20261011T144150Z_19d3274fd12e49d5b3cb9abbd73da5ea/model/trained_model.joblib
        target: /app/model/trained_model.joblib
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
